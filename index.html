<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6b4a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমার হিসাব</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#1d2a22;--mut:#6b7a70;--line:#dfe6dd;--g:#1f6b4a;--gl:#e1f0e8;--r:#b3402f;--rl:#f7e3df;--a:#b07d1c;--al:#f6ecd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1b261f;--ink:#e7efe9;--mut:#93a499;--line:#2c3a31;--g:#57c08f;--gl:#1f3a2c;--r:#ef8a7a;--rl:#3d2420;--a:#e0b050;--al:#3a3118}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;font-size:16px}
body{max-width:520px;margin:0 auto;padding:14px 14px 110px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:4px}
label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;width:100%;margin-top:14px;font-weight:600}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:6px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:8px;color:var(--mut)}
.seg button.on{background:var(--g);color:#fff}
.seg.out button.on{background:var(--r)}
.num{font-size:21px;font-weight:700}.in{color:var(--g)}.ex{color:var(--r)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:12px;padding:10px 12px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--r)}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.x{border:0;background:none;color:var(--mut);font-size:20px;padding:0 6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;gap:8px;max-width:520px;margin:0 auto}
nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 2px;color:var(--mut);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--g);border-color:var(--g);color:#fff}
.cat{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cb{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;color:var(--ink)}
.cb.on{background:var(--g);border-color:var(--g);color:#fff}
.cb.plus{border-style:dashed;color:var(--g);font-weight:700}
.cb span{margin-left:8px;color:var(--r);font-weight:700}.cb.on span{color:#fff}
.lk{border:0;background:none;color:var(--g);padding:0;font-size:13px;margin-top:6px}
.it{border-bottom:1px solid var(--line)}.it:last-child{border:0}
.chip{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:6px 4px 6px 12px;margin:6px 6px 0 0}
.chip button{border:0;background:none;color:var(--r);font-size:18px;line-height:1;padding:0 8px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sr.tot{border-bottom:0;border-top:2px solid var(--line);margin-top:2px;padding-top:12px}
.msel{width:auto;max-width:70%;border:0;background:transparent;font-weight:700;font-size:17px;text-align:center;margin:0}
.bar.g i{background:var(--g)}
.pf{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card);width:100%;text-align:left}
.empty{text-align:center;color:var(--mut);padding:22px 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var KEY="hisab_v1",S={profiles:[],cur:null},tab="home",month=today().slice(0,7);
var F={w:"p",t:"out",c:"",a:"",d:today(),n:""};
var CATS={pin:["মাদ্রাসার বেতন","টিউশন","হাদিয়া"],pout:["পরিবার","নিজের জন্য","যাতায়াত"],fin:["প্রতিষ্ঠান থেকে প্রাপ্তি"],fout:["নাস্তা","রাস্তা/যাতায়াত"]};
function load(){try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}}
function saveLocal(){try{localStorage.setItem(lk(),JSON.stringify(S))}catch(e){alert("ডেটা সেভ করা যায়নি। ব্রাউজারের স্টোরেজ বন্ধ থাকতে পারে।")}}
/* ===== Firebase সেটিং: নিচের ৪টি মান নিজের প্রজেক্টের কোড দিয়ে বদলান ===== */
var cfg={apiKey:"AIzaSyCEi9jzJ3plTbpcqGDzatnYlTzhbOhUJE0",authDomain:"abdurrahmanjamii.firebaseapp.com",projectId:"abdurrahmanjamii",appId:"1:872713119272:web:addd0fb1039fa7ed8d371d"};
var cloud=cfg.apiKey.indexOf("YOUR")<0,user=null,db=null,auth=null,ready=false,authReady=false,st="",old=null;
function lk(){return user?KEY+"_"+user.uid:KEY}
function save(){saveLocal();if(user&&db){st="সেভ হচ্ছে…";hint();db.collection("users").doc(user.uid).set({d:JSON.stringify({profiles:S.profiles}),t:Date.now()}).then(function(){st="☁ ক্লাউডে সেভ হয়েছে";hint()}).catch(function(){st="⚠ ক্লাউডে সেভ হয়নি, নেট চেক করুন";hint()})}}
function hint(){var e=document.getElementById("st");if(e)e.textContent=st}
function readLocal(){try{var r=localStorage.getItem(lk());return r?JSON.parse(r).profiles||[]:[]}catch(e){return[]}}
function lastCur(){try{var r=localStorage.getItem(lk());return r?JSON.parse(r).cur:null}catch(e){return null}}
function setCur(){var c=S.cur;if(!S.profiles.some(function(p){return p.id===c}))c=S.profiles.length===1?S.profiles[0].id:null;S.cur=c}
function initCloud(){
  if(!cloud)return;old=S.profiles.length?S.profiles:null;
  try{firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){})}catch(e){alert("Firebase সেটিং ঠিক নেই");authReady=true;render();return}
  auth.onAuthStateChanged(function(u){
    user=u;ready=false;authReady=true;
    if(!u){S={profiles:[],cur:null};render();return}
    var c=lastCur();render();
    db.collection("users").doc(u.uid).get().then(function(doc){
      if(doc.exists){S={profiles:JSON.parse(doc.data().d).profiles||[],cur:c}}
      else{S={profiles:(old&&confirm("এই ফোনে আগের হিসাব আছে। এটা এই গুগল অ্যাকাউন্টে তুলবেন?"))?old:[],cur:c}}
      setCur();ready=true;if(doc.exists)saveLocal();else save();render();
    }).catch(function(){S={profiles:readLocal(),cur:c};setCur();ready=true;render()});
  });
}
function loginScr(){return '<h1>আমার হিসাব</h1><div class="card"><p>গুগল অ্যাকাউন্ট দিয়ে ঢুকুন। আপনার হিসাব আপনার অ্যাকাউন্টে জমা থাকবে, ফোন বদলালেও নতুন ফোনে ঢুকলেই ফেরত পাবেন। প্রত্যেকের হিসাব আলাদা।</p><button class="btn" onclick="gin()">গুগল দিয়ে সাইন-ইন করুন</button></div>'}
function gin(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){alert("সাইন-ইন হয়নি: "+e.code)})}
function acct(){return cloud&&user?'<div class="card"><b>'+esc(user.displayName||"")+'</b><div class="mut">'+esc(user.email||"")+'</div><div class="mut" id="st">'+st+'</div><button class="btn o" onclick="auth.signOut()">সাইন-আউট</button></div>':!cloud?'<div class="card mut">ক্লাউড চালু নেই, ডেটা শুধু এই ফোনে জমা হচ্ছে।</div>':''}
function me(){return S.profiles.find(function(p){return p.id===S.cur})}
function bn(n){return Number(n||0).toLocaleString("bn-BD")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function getCats(k){var p=me();if(!p.cats)p.cats={};if(!p.cats[k])p.cats[k]=CATS[k].slice();return p.cats[k]}
function cats(){return getCats(F.w+F.t)}
function addCat(k,n){var a=getCats(k);if(a.indexOf(n)<0)a.push(n);save()}
function delCat(k,i){var a=getCats(k);if(a.length<2)return alert("কমপক্ষে একটি ক্যাটাগরি রাখতে হবে");if(!confirm("“"+a[i]+"” মুছবেন? আগের এন্ট্রিগুলো যেমন আছে তেমনই থাকবে।"))return;a.splice(i,1);save();render()}
function catAdd(k){var el=document.getElementById("nc"+k),n=el.value.trim();if(!n)return;addCat(k,n);render()}
function selCat(v){if(v!=="__new"){F.c=v;return}keep();var n=prompt("নতুন ক্যাটাগরির নাম লিখুন");if(n&&n.trim()){addCat(F.w+F.t,n.trim());F.c=n.trim()}render()}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
var IC={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',add:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',cat:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><path d="M7 7h.01"/>',more:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
function nb(t,l){return '<button class="'+(tab===t?"on":"")+'" onclick="go(\''+t+'\')"><svg viewBox="0 0 24 24">'+IC[t]+'</svg>'+l+'</button>'}
function catScr(){
  var G=[["pin","ব্যক্তিগত আয়"],["pout","ব্যক্তিগত খরচ"],["fin","প্রতিষ্ঠান ফান্ড: টাকা পাওয়া"],["fout","প্রতিষ্ঠান ফান্ড: খরচ"]];
  return '<p class="mut">নিজের মতো ক্যাটাগরি যোগ করুন বা মুছুন।</p>'+G.map(function(g){
    var k=g[0],chips=getCats(k).map(function(c,i){return '<span class="chip">'+esc(c)+'<button onclick="delCat(\''+k+'\','+i+')">×</button></span>'}).join("");
    return '<div class="card"><b>'+g[1]+'</b><div>'+chips+'</div><div class="row" style="margin-top:10px"><input id="nc'+k+'" placeholder="নতুন নাম"><button class="btn" style="width:auto;margin:4px 0 0;padding:11px 16px" onclick="catAdd(\''+k+'\')">যোগ</button></div></div>'}).join("");
}

function render(){
  var el=document.getElementById("app");
  if(cloud&&!authReady){el.innerHTML='<div class="empty">লোড হচ্ছে…</div>';return}
  if(cloud&&!user){el.innerHTML=loginScr();return}
  if(cloud&&!ready){el.innerHTML='<div class="empty">লোড হচ্ছে…</div>';return}
  if(!me()){el.innerHTML=profiles();return}
  var h='<div class="row sp"><h1>'+esc(me().name)+' এর হিসাব</h1></div>';
  h+=tab==="home"?home():tab==="add"?add():tab==="list"?list():tab==="cat"?catScr():more();
  h+='<nav><div>'+nb('home','সারসংক্ষেপ')+nb('add','নতুন এন্ট্রি')+nb('list','বিবরণ')+nb('more','অ্যাকাউন্ট')+'</div></nav>';
  el.innerHTML=h;
}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function go(t){if(tab==="add"&&t!=="add"&&EDIT){EDIT=null;F.a="";F.n=""}if(t==="add"&&!EDIT)F.w=VW;tab=t;OPEN=null;render();window.scrollTo(0,0)}
function profiles(){
  var h='<h1>কে ব্যবহার করছেন?</h1><p class="mut">প্রত্যেকের হিসাব আলাদা থাকে। সব ডেটা শুধু এই ফোনেই জমা হয়।</p>';
  S.profiles.forEach(function(p){h+='<button class="pf" onclick="pick(\''+p.id+'\')"><b>'+esc(p.name)+'</b><span class="mut">'+bn(p.entries.length)+' টি এন্ট্রি</span></button>'});
  h+='<div class="card"><label>নতুন নাম যোগ করুন</label><input id="pn" placeholder="যেমন: আব্দুল্লাহ"><button class="btn" onclick="addProf()">প্রোফাইল তৈরি করুন</button></div>';
  if(cloud&&user)h+='<button class="btn o" onclick="doLogout()">লগআউট</button>';
  return h;
}
function addProf(){var v=document.getElementById("pn").value.trim();if(!v)return alert("নাম লিখুন");var p={id:"p"+Date.now(),name:v,entries:[]};S.profiles.push(p);S.cur=p.id;tab="home";save();render()}
function pick(id){S.cur=id;tab="home";save();render()}
function logout(){S.cur=null;save();render()}
function mname(m){return new Date(m+"-01").toLocaleDateString("bn-BD",{month:"long",year:"numeric"})}
function monthBar(){
  var ms=uniq(me().entries.map(function(e){return e.d.slice(0,7)}).concat([today().slice(0,7),month])).sort().reverse();
  return '<div class="row sp"><button class="x" onclick="mv(-1)">‹</button><select class="msel" onchange="month=this.value;OPEN=null;render()">'+ms.map(function(m){return '<option value="'+m+'"'+(m===month?' selected':'')+'>'+mname(m)+'</option>'}).join("")+'</select><button class="x" onclick="mv(1)">›</button></div>';
}
function mv(d){var p=month.split("-"),y=+p[0],m=+p[1]-1+d;y+=Math.floor(m/12);m=((m%12)+12)%12;month=y+"-"+("0"+(m+1)).slice(-2);OPEN=null;render()}
function bal(all,w,before){return all.filter(function(e){return e.w===w&&e.d.slice(0,7)<before}).reduce(function(s,e){return s+(e.t==="in"?e.a:-e.a)},0)}
function sum(es,w,t){return es.filter(function(e){return e.w===w&&e.t===t}).reduce(function(s,e){return s+e.a},0)}
var VW="p",EDIT=null;
function vw(w){VW=w;OPEN=null;render()}
function wtab(){return '<div class="seg" style="margin:6px 0 12px"><button class="'+(VW==="p"?"on":"")+'" onclick="vw(\'p\')">ব্যক্তিগত</button><button class="'+(VW==="f"?"on":"")+'" onclick="vw(\'f\')">প্রতিষ্ঠান ফান্ড</button></div>'}
function stm(op,inn,out,w){
  var cl=op+inn-out;
  return '<div class="sr"><span>পূর্ব মাসের অবশিষ্ট (জের)</span><b class="'+(op<0?"ex":"")+'">৳'+bn(op)+'</b></div>'
  +'<div class="sr"><span>'+(w==="p"?"এ মাসের আয়":"এ মাসে পেয়েছি")+'</span><b class="in">+৳'+bn(inn)+'</b></div>'
  +'<div class="sr"><span>এ মাসের খরচ</span><b class="ex">−৳'+bn(out)+'</b></div>'
  +'<div class="sr tot"><b>'+(w==="p"?"নিজের অবশিষ্ট":"ফান্ডে অবশিষ্ট")+'</b><b class="num '+(cl<0?"ex":"in")+'">৳'+bn(cl)+'</b></div>';
}
function brk(es,w,t,title){
  var m={},tot=0;
  es.filter(function(e){return e.w===w&&e.t===t}).forEach(function(e){m[e.c]=(m[e.c]||0)+e.a;tot+=e.a});
  var ks=Object.keys(m).sort(function(a,b){return m[b]-m[a]});
  if(!ks.length)return '';
  return '<div class="card"><div class="row sp"><b>'+title+'</b><b class="'+(t==="in"?"in":"ex")+'">৳'+bn(tot)+'</b></div>'+ks.map(function(k){return '<div style="margin-top:10px"><div class="row sp"><span>'+esc(k)+'</span><span>৳'+bn(m[k])+'</span></div><div class="bar '+(t==="in"?"g":"")+'"><i style="width:'+Math.round(m[k]/tot*100)+'%"></i></div></div>'}).join("")+'</div>';
}
function home(){
  var all=me().entries,w=VW,es=all.filter(function(e){return e.w===w&&e.d.slice(0,7)===month});
  var op=bal(all,w,month),inn=sum(es,w,"in"),out=sum(es,w,"out");
  var h=wtab()+monthBar();
  h+='<div class="card" style="margin-top:10px"><div class="mut" style="margin-bottom:4px">'+(w==="p"?"ব্যক্তিগত হিসাব":"প্রতিষ্ঠান ফান্ড")+' — সংক্ষিপ্ত হিসাব</div>'+stm(op,inn,out,w)+'</div>';
  if(!es.length)h+='<div class="empty">এ মাসে কোনো এন্ট্রি নেই।</div>';
  h+=brk(es,w,"in",w==="p"?"আয় (ক্যাটাগরি অনুযায়ী)":"পাওয়া (ক্যাটাগরি অনুযায়ী)")+brk(es,w,"out","খরচ (ক্যাটাগরি অনুযায়ী)");
  h+='<div class="mut" style="text-align:center;margin:6px 0">এই অবশিষ্ট ৳'+bn(op+inn-out)+' পরের মাসে “পূর্ব মাসের অবশিষ্ট” হিসেবে যোগ হবে।</div>';
  if(w==="f")h+='<button class="btn o" onclick="report()">প্রতিষ্ঠান ফান্ডের রিপোর্ট দেখুন / প্রিন্ট করুন</button>';
  return h;
}
var ED=false;
function catPick(){
  var a=cats(),k=F.w+F.t,h='<label>ক্যাটাগরি</label><div class="cat">';
  a.forEach(function(c,i){h+='<button class="cb'+(c===F.c?' on':'')+'" onclick="pickCat('+i+')">'+esc(c)+(ED?'<span onclick="event.stopPropagation();renCat(\''+k+'\','+i+')">✎</span><span onclick="event.stopPropagation();delCat(\''+k+'\','+i+')">✕</span>':'')+'</button>'});
  h+='<button class="cb plus" onclick="newCat()">＋ নতুন</button></div>';
  return h+(ED?'<div class="mut" style="margin-top:6px">✎ চাপলে নাম ঠিক করা যাবে (আগের এন্ট্রির নামও নতুন নামে বদলে যাবে)। ✕ চাপলে ক্যাটাগরি মুছবে, আগের এন্ট্রি থেকে যাবে।</div>':'')+'<button class="lk" onclick="keep();ED=!ED;render()">'+(ED?'সম্পাদনা শেষ':'ক্যাটাগরির নাম ঠিক বা মুছতে চান?')+'</button>';
}
function pickCat(i){keep();F.c=cats()[i];render()}
function newCat(){keep();var n=prompt("নতুন ক্যাটাগরির নাম লিখুন");if(n&&n.trim()){addCat(F.w+F.t,n.trim());F.c=n.trim()}render()}
function add(){
  if(cats().indexOf(F.c)<0)F.c=cats()[0];
  var h='<div class="card">'+(EDIT?'<div class="mut" style="color:var(--a)">✎ এন্ট্রি সম্পাদনা করছেন। আগের তথ্য ইতিহাসে জমা থাকবে।</div>':'')+'<label>কোন হিসাব?</label><div class="seg"><button class="'+(F.w==="p"?"on":"")+'" onclick="sf(\'w\',\'p\')">ব্যক্তিগত</button><button class="'+(F.w==="f"?"on":"")+'" onclick="sf(\'w\',\'f\')">প্রতিষ্ঠান ফান্ড</button></div>';
  h+='<div class="seg '+(F.t==="out"?"out":"")+'"><button class="'+(F.t==="in"?"on":"")+'" onclick="sf(\'t\',\'in\')">'+(F.w==="p"?"আয়":"টাকা পেলাম")+'</button><button class="'+(F.t==="out"?"on":"")+'" onclick="sf(\'t\',\'out\')">খরচ</button></div>';
  h+=catPick();
  h+='<label>টাকার পরিমাণ</label><input id="fa" type="number" inputmode="decimal" min="0" placeholder="0" value="'+esc(F.a)+'">';
  h+='<label>তারিখ</label><input id="fd" type="date" value="'+F.d+'">';
  h+='<label>বিবরণ (ঐচ্ছিক): কী কিনলেন বা কার কাছ থেকে পেলেন</label><input id="fn" placeholder="যেমন: ১ কেজি আলু" value="'+esc(F.n)+'">';
  return h+'<button class="btn" onclick="submit()">'+(EDIT?"পরিবর্তন সংরক্ষণ করুন":"সংরক্ষণ করুন")+'</button>'+(EDIT?'<button class="btn o" onclick="cancelEdit()">বাতিল</button>':'')+'</div>';
}
function sf(k,v){keep();F[k]=v;render()}
function keep(){var a=document.getElementById("fa");if(a){F.a=a.value;F.d=document.getElementById("fd").value;F.n=document.getElementById("fn").value}}
function renCat(k,i){
  var a=getCats(k),old=a[i],n=prompt("ক্যাটাগরির সঠিক নাম লিখুন",old);
  if(!n||!n.trim()||n.trim()===old)return;n=n.trim();
  var w=k.charAt(0),t=k.slice(1);
  me().entries.forEach(function(e){if(e.w===w&&e.t===t&&e.c===old)e.c=n});
  if(a.indexOf(n)>=0)a.splice(i,1);else a[i]=n;
  if(F.c===old)F.c=n;save();render();
}
function snap(e){return {w:e.w,t:e.t,c:e.c,a:e.a,d:e.d,n:e.n,at:Date.now()}}
function findE(id){return me().entries.find(function(x){return x.id===id})}
function submit(){
  keep();var a=parseFloat(F.a);
  if(!(a>0))return alert("সঠিক টাকার পরিমাণ লিখুন");
  if(!F.d)return alert("তারিখ দিন");
  if(EDIT){var e=findE(EDIT);if(e){if(!e.h)e.h=[];e.h.push(snap(e));e.w=F.w;e.t=F.t;e.c=F.c;e.a=a;e.d=F.d;e.n=F.n.trim()}EDIT=null}
  else me().entries.push({id:"e"+Date.now(),w:F.w,t:F.t,c:F.c,a:a,d:F.d,n:F.n.trim()});
  F.a="";F.n="";VW=F.w;save();tab="list";month=F.d.slice(0,7);OPEN=null;render();
}
function startEdit(id){var e=findE(id);if(!e)return;F={w:e.w,t:e.t,c:e.c,a:String(e.a),d:e.d,n:e.n||""};EDIT=id;tab="add";render();window.scrollTo(0,0)}
function cancelEdit(){EDIT=null;F.a="";F.n="";tab="list";render()}
function restoreVer(id,i){
  var e=findE(id);if(!e||!e.h||!e.h[i])return;
  if(!confirm("এই আগের তথ্য ফিরিয়ে আনবেন? বর্তমান তথ্যও ইতিহাসে থেকে যাবে।"))return;
  var cur=snap(e),v=e.h.splice(i,1)[0];
  e.w=v.w;e.t=v.t;e.c=v.c;e.a=v.a;e.d=v.d;e.n=v.n;e.h.push(cur);save();render();
}
var OPEN=null;
function tog(id){OPEN=OPEN===id?null:id;render()}
function list(){
  var all=me().entries,w=VW;
  var es=all.filter(function(e){return e.w===w&&e.d.slice(0,7)===month}).sort(function(a,b){return b.d.localeCompare(a.d)||b.id.localeCompare(a.id)});
  var op=bal(all,w,month),inn=sum(es,w,"in"),out=sum(es,w,"out");
  var h=wtab()+monthBar()+'<div class="card" style="margin-top:10px"><div class="mut" style="margin-bottom:4px">'+(w==="p"?"ব্যক্তিগত হিসাব":"প্রতিষ্ঠান ফান্ড")+' — বিস্তারিত হিসাব</div>'+stm(op,inn,out,w)+'</div>';
  h+='<div class="card">';
  if(!es.length)h+='<div class="empty">এ মাসে কোনো এন্ট্রি নেই।<br>“নতুন এন্ট্রি” থেকে যোগ করুন।</div>';
  else h+='<div class="mut" style="margin-bottom:4px">এন্ট্রির ওপর চাপলে সম্পাদনা বা মুছার অপশন আসবে</div>';
  es.forEach(function(e){
    h+='<div class="it" onclick="tog(\''+e.id+'\')"><div class="item" style="border:0"><div><b>'+esc(e.n||e.c)+'</b><div class="mut">'+(e.n?esc(e.c)+" · ":"")+new Date(e.d).toLocaleDateString("bn-BD",{day:"numeric",month:"short"})+(e.h&&e.h.length?" · সম্পাদিত":"")+'</div></div><b class="'+(e.t==="in"?"in":"ex")+'">'+(e.t==="in"?"+":"−")+'৳'+bn(e.a)+'</b></div>';
    if(OPEN===e.id){
      h+='<div class="row" style="margin-bottom:10px"><button class="btn o" style="margin:0" onclick="event.stopPropagation();startEdit(\''+e.id+'\')">✎ সম্পাদনা</button><button class="btn o" style="margin:0;color:var(--r)" onclick="event.stopPropagation();del(\''+e.id+'\')">মুছে ফেলুন</button></div>';
      if(e.h&&e.h.length){
        h+='<div class="mut" style="margin-bottom:6px">আগের সংস্করণ:</div>';
        for(var i=e.h.length-1;i>=0;i--){var v=e.h[i];h+='<div class="row sp" style="margin-bottom:8px"><div class="mut">'+esc(v.n||v.c)+' · ৳'+bn(v.a)+' · '+esc(v.d)+'</div><button class="btn o" style="width:auto;margin:0;padding:6px 10px" onclick="event.stopPropagation();restoreVer(\''+e.id+'\','+i+')">ফিরিয়ে আনুন</button></div>'}
      }
    }
    h+='</div>';
  });
  return h+'</div>';
}
function del(id){if(!confirm("এই এন্ট্রি মুছে ফেলবেন?"))return;var p=me();p.entries=p.entries.filter(function(e){return e.id!==id});save();render()}
function doLogout(){if(confirm("লগআউট করবেন? আবার ঢুকতে গুগল দিয়ে সাইন-ইন করতে হবে।"))auth.signOut()}
function renProf(){var p=me(),n=prompt("প্রোফাইলের নতুন নাম",p.name);if(n&&n.trim()){p.name=n.trim();save();render()}}
function more(){
  var h='';
  if(cloud&&user)h+='<div class="card"><div class="row">'+(user.photoURL?'<img src="'+esc(user.photoURL)+'" alt="" referrerpolicy="no-referrer" style="width:48px;height:48px;border-radius:50%">':'')+'<div><b>'+esc(user.displayName||"")+'</b><div class="mut">'+esc(user.email||"")+'</div></div></div><div class="mut" id="st" style="margin-top:8px">'+st+'</div><button class="btn o" style="color:var(--r)" onclick="doLogout()">লগআউট</button></div>';
  else if(!cloud)h+='<div class="card mut">ক্লাউড চালু নেই, ডেটা শুধু এই ফোনে জমা হচ্ছে।</div>';
  h+='<h2>প্রোফাইল</h2><div class="card">';
  S.profiles.forEach(function(q){var c=q.id===S.cur;h+='<button class="pf" onclick="pick(\''+q.id+'\')"><b>'+esc(q.name)+'</b><span class="'+(c?"in":"mut")+'">'+(c?"✓ চলমান":"সুইচ করুন")+'</span></button>'});
  h+='<label>নতুন প্রোফাইল</label><input id="pn" placeholder="নাম"><button class="btn" onclick="addProf()">প্রোফাইল যোগ করুন</button><div class="row"><button class="btn o" onclick="renProf()">নাম বদলান</button><button class="btn o" style="color:var(--r)" onclick="delProf()">মুছুন</button></div></div>';
  if(cloud&&user)h+='<div class="card"><b>পাসওয়ার্ড ও নিরাপত্তা</b><p class="mut">লগইন গুগলের মাধ্যমে হয়, তাই পাসওয়ার্ড ও 2-Step Verification গুগল অ্যাকাউন্টে বদলাতে হবে।</p><a class="btn o" style="display:block;text-align:center;text-decoration:none" href="https://myaccount.google.com/security" target="_blank" rel="noopener">গুগল অ্যাকাউন্ট সেটিংস</a></div>';
  h+='<div class="card"><b>ডেটা ব্যাকআপ</b><p class="mut">ক্লাউডের পাশাপাশি মাঝে মাঝে ফাইল ব্যাকআপ রাখা ভালো।</p><button class="btn" onclick="exp()">সব প্রোফাইলের ব্যাকআপ নামান</button><label>ব্যাকআপ ফাইল ফেরত আনুন</label><input type="file" accept=".json" onchange="imp(this)"></div>';
  return h;
}
function exp(){var b=new Blob([JSON.stringify(S)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="hisab-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove()}
function imp(i){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.profiles)throw 0;if(!confirm("বর্তমান সব ডেটা বদলে ব্যাকআপের ডেটা বসবে। নিশ্চিত?"))return;S=d;S.cur=null;save();render()}catch(e){alert("ফাইলটি সঠিক ব্যাকআপ নয়")}};r.readAsText(f)}
function delProf(){if(!confirm("এই প্রোফাইল ও এর সব হিসাব স্থায়ীভাবে মুছে যাবে। নিশ্চিত?"))return;S.profiles=S.profiles.filter(function(p){return p.id!==S.cur});S.cur=null;save();render()}
function report(){
  var es=me().entries.filter(function(e){return e.w==="f"}).sort(function(a,b){return a.d.localeCompare(b.d)}),bal=0;
  var rows=es.map(function(e){bal+=e.t==="in"?e.a:-e.a;return"<tr><td>"+e.d+"</td><td>"+esc(e.c)+(e.n?" ("+esc(e.n)+")":"")+"</td><td>"+(e.t==="in"?e.a:"")+"</td><td>"+(e.t==="out"?e.a:"")+"</td><td>"+bal+"</td></tr>"}).join("");
  var w=window.open("","_blank");
  if(!w)return alert("নতুন ট্যাব খুলতে দিন, তারপর আবার চেষ্টা করুন");
  w.document.write('<meta charset="utf-8"><title>ফান্ড রিপোর্ট</title><style>body{font-family:sans-serif;padding:16px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px;font-size:14px;text-align:left}</style><h2>প্রতিষ্ঠান ফান্ডের হিসাব — '+esc(me().name)+'</h2><table><tr><th>তারিখ</th><th>বিবরণ</th><th>প্রাপ্তি</th><th>খরচ</th><th>বাকি</th></tr>'+rows+'</table><h3>বর্তমান বাকি: ৳'+bal+'</h3><button onclick="print()">প্রিন্ট / PDF</button>');
  w.document.close();
}
load();render();initCloud();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
</body>
